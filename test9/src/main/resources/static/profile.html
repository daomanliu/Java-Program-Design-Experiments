<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>个人中心</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; padding-top: 100px; background: #f5f5f5; }
        .box { background: #fff; padding: 30px; border: 1px solid #ddd; width: 300px; }
        h2 { margin: 0 0 20px; font-size: 18px; }
        p { font-size: 14px; margin: 10px 0; }
        button { width: 100%; padding: 8px; background: #333; color: #fff; border: none; cursor: pointer; margin-top: 10px; }
        button:hover { background: #555; }
        #msg { text-align: center; color: red; font-size: 13px; min-height: 18px; }
    </style>
</head>
<body>
<div class="box">
    <h2>个人中心</h2>
    <p>ID：<span id="uid">-</span></p>
    <p>用户名：<span id="uname">-</span></p>
    <button onclick="logout()">退出登录</button>
    <p id="msg"></p>
    <p style="text-align:center"><a href="index.html">返回首页</a></p>
</div>
<script>
    // 加载用户信息
    (async function () {
        const token = localStorage.getItem('token');
        if (!token) { document.getElementById('msg').textContent = '未登录'; return; }
        const resp = await fetch('/profile', {
            headers: { 'Authorization': 'Bearer ' + token }
        });
        if (resp.ok) {
            const data = await resp.json();
            document.getElementById('uid').textContent = data.data.id;
            document.getElementById('uname').textContent = data.data.name;
        } else {
            document.getElementById('msg').textContent = '登录已失效，请重新登录';
        }
    })();

    // 退出登录
    async function logout() {
        const token = localStorage.getItem('token');
        const resp = await fetch('/logout', {
            method: 'POST',
            headers: { 'Authorization': 'Bearer ' + token }
        });
        const data = await resp.json();
        localStorage.removeItem('token');   // 无论成败都清本地
        alert(data.msg);
        location.href = 'login.html';
    }
</script>
</body>
</html>

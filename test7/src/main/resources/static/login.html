<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>登录</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; padding-top: 100px; background: #f5f5f5; }
        .box { background: #fff; padding: 30px; border: 1px solid #ddd; width: 300px; }
        h2 { margin: 0 0 20px; font-size: 18px; }
        input { width: 100%; padding: 8px 10px; margin-bottom: 12px; border: 1px solid #ccc; box-sizing: border-box; }
        button { width: 100%; padding: 8px; background: #333; color: #fff; border: none; cursor: pointer; }
        button:hover { background: #555; }
        #msg { text-align: center; margin-top: 12px; font-size: 14px; min-height: 18px; }
        .ok { color: green; } .err { color: red; }
        .link { text-align: center; margin-top: 12px; font-size: 13px; }
    </style>
</head>
<body>
<div class="box">
    <h2>用户登录</h2>
    <label for="name"></label><input type="text" id="name" placeholder="用户名">
    <label for="password"></label><input type="password" id="password" placeholder="密码">
    <button onclick="doLogin()">登 录</button>
    <p id="msg"></p>
    <p class="link">没有账号？<a href="register.html">去注册</a>　<a href="users.html">用户列表</a></p>
</div>
<script>
    async function doLogin() {
        const msg = document.getElementById('msg');
        msg.className = ''; msg.textContent = '登录中...';
        try {
            const resp = await fetch('/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    name: document.getElementById('name').value,
                    password: document.getElementById('password').value
                })
            });
            const data = await resp.json();
            if (data.code === 200) {
                localStorage.setItem('token', data.data);
                msg.className = 'ok';
                msg.textContent = data.msg;
            } else {
                msg.className = 'err';
                msg.textContent = data.msg;
            }
        } catch (e) {
            msg.className = 'err';
            msg.textContent = '请求失败';
        }
    }
</script>
</body>
</html>

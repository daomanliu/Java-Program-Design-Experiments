<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>用户列表</title>
    <style>
        body { font-family: sans-serif; display: flex; flex-direction: column; align-items: center; padding-top: 60px; background: #f5f5f5; }
        .box { background: #fff; padding: 30px; border: 1px solid #ddd; width: 500px; }
        h2 { margin: 0 0 20px; font-size: 18px; }
        button { padding: 8px 20px; background: #333; color: #fff; border: none; cursor: pointer; }
        button:hover { background: #555; }
        #msg { margin: 12px 0; font-size: 14px; min-height: 18px; }
        .ok { color: green; } .err { color: red; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; font-size: 14px; }
        th { background: #f0f0f0; }
        .link { text-align: center; margin-top: 12px; font-size: 13px; }
    </style>
</head>
<body>
<div class="box">
    <h2>用户列表（需要 ADMIN 权限）</h2>
    <button onclick="loadUsers()">加载用户列表</button>
    <p id="msg"></p>
    <table id="table"></table>
    <p class="link"><a href="login.html">返回登录</a></p>
</div>
<script>
    async function loadUsers() {
        const token = localStorage.getItem('token');
        const msg = document.getElementById('msg');
        const table = document.getElementById('table');

        if (!token) {
            msg.className = 'err';
            msg.textContent = '未登录，请先登录';
            return;
        }
        msg.className = ''; msg.textContent = '请求中...';
        table.innerHTML = '';

        try {
            const resp = await fetch('/users', {
                headers: { 'Authorization': 'Bearer ' + token }
            });
            const data = await resp.json();

            if (resp.ok) {
                msg.className = 'ok';
                msg.textContent = '加载成功';
                table.innerHTML = '<tr><th>ID</th><th>用户名</th></tr>' +
                    data.data.map(u => `<tr><td>${u.id}</td><td>${u.name}</td></tr>`).join('');
            } else {
                msg.className = 'err';
                msg.textContent = (data.msg || resp.status) + '：无权限查看';
            }
        } catch (e) {
            msg.className = 'err';
            msg.textContent = '请求失败';
        }
    }
</script>
</body>
</html>

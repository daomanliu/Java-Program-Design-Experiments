<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <title>登录</title>
    <style>
        body {
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            padding-top: 100px;
            background: #f0f0f0;
        }
        .box {
            background: #fff;
            padding: 30px;
            border-radius: 8px;
            border: 1px solid #ddd;
            width: 300px;
        }
        h2 { margin: 0 0 20px; font-size: 18px; }
        input {
            width: 100%;
            padding: 8px 10px;
            margin-bottom: 12px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }
        button {
            width: 100%;
            padding: 8px;
            background: #333;
            color: #fff;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover { background: #555; }
        #msg { text-align: center; margin-top: 12px; font-size: 14px; min-height: 18px; }
        .ok { color: green; }
        .err { color: red; }
    </style>
</head>
<body>
<div class="box">
    <h2>用户登录</h2>
    <input type="text" id="name" placeholder="用户名">
    <input type="password" id="password" placeholder="密码">
    <button onclick="doLogin()">登 录</button>
    <p id="msg"></p>
</div>

<script>
    async function doLogin() {
        const msg = document.getElementById('msg');
        msg.className = '';
        msg.textContent = '登录中...';

        try {
            const resp = await fetch('/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    name: document.getElementById('name').value,
                    password: document.getElementById('password').value
                })
            });
            const data = await resp.json();

            // 你的 Result 字段是 code / msg / data
            if (data.code === 200) {
                msg.className = 'ok';
                msg.textContent = data.msg;
            } else {
                msg.className = 'err';
                msg.textContent = data.msg;
            }
        } catch (e) {
            msg.className = 'err';
            msg.textContent = '请求失败，请检查后端';
        }
    }
</script>
</body>
</html>
